name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # ubuntu-latest 已预装 Android SDK（含 API 35 / build-tools 35），无需额外 setup
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || echo "Warning: android-35 platform not preinstalled"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle', 'android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Download FFmpeg AAR
        run: |
          mkdir -p android/libs
          curl -fL --retry 3 -o android/libs/ffmpeg-kit-https.aar \
            https://github.com/2004durgesh/react-native-ffmpeg-kit/releases/download/ffmpeg-android-6.0.3/ffmpeg-kit-https.aar
          ls -lh android/libs/ffmpeg-kit-https.aar

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found" && exit 1
          fi
          cp "$APK" downkyi-android-release.apk
          echo "path=downkyi-android-release.apk" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h downkyi-android-release.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: downkyi-android-apk
          path: downkyi-android-release.apk
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: downkyi-android-release.apk
          generate_release_notes: true

      - name: Summary
        run: |
          echo "### APK built successfully :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: downkyi-android-release.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: ${{ steps.apk.outputs.size }}" >> "$GITHUB_STEP_SUMMARY"
